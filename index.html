  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent!important;}
    button,a,[role="button"]{user-select:none;-webkit-user-select:none;}

    /* ── iOS material tokens — dark (default) ────────────────── */

      --ultra-thin: rgba(255,255,255,0.04);
      --thin:       rgba(255,255,255,0.08);
      --regular:    rgba(255,255,255,0.14);
      --thick:      rgba(255,255,255,0.22);

      --border-dark:  rgba(0,0,0,0.08);

      --divider: rgba(255,255,255,0.1);

    [data-theme="light"]{
      --ultra-thin: rgba(255,255,255,0.12);
      --thin:       rgba(255,255,255,0.18);
      --regular:    rgba(255,255,255,0.28);

    .material,.glass{
      backdrop-filter: blur(30px) saturate(1.8);

      content:"";

      inset:0;
      border-radius:inherit;

      pointer-events:none;

    .col-right{ display:none; }
    @media(min-width:1024px){
      .col-right{ display:flex; }
      /* hide the mobile-fallback duplicate cards that live inside col-left */
      .desktop-hidden{ display:none; }

    /* ── Mobile vs Desktop layout trees ───────────── */
    /* Mobile layout: visible below 1024px, hidden above */
    .mobile-layout  { display:block; }

    @media(min-width:1024px){
      .mobile-layout  { display:none;  }
      .desktop-layout { display:block; }

<body>
<div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.4);font-size:14px;gap:10px;"><div class="spin" style="width:18px;height:18px;border-radius:50%;border:2px solid rgba(72,198,239,.3);border-top-color:#48C6EF;"></div>Loading…</div></div>

<script type="text/babel" data-presets="react-custom">
const {useState,useEffect,useRef,useCallback,useMemo} = React;

/* ═══════════════════════════════════════════════════════
   DYNAMIC MAPS LOADER
═══════════════════════════════════════════════════════ */
let _mapPromise = null;
const loadGoogleMaps = async () => {
  if (window.google && window.google.maps) return;
  if (_mapPromise) return _mapPromise;
  
  _mapPromise = new Promise(async (resolve, reject) => {
    try {
      const response = await fetch('/api/get-map-key');
      const data = await response.json();
      
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${data.key}&v=beta`;
      script.async = true;
      script.defer = true;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    } catch (error) {
      console.error("Failed to load Google Maps API key:", error);
      reject(error);
    }
  });
  return _mapPromise;
};

/* ═══════════════════════════════════════════════════════
   UNIT HELPERS
═══════════════════════════════════════════════════════ */
const cvtT = (v,i) => { if(v==="--"||v==null) return "--"; return i ? Math.round(v*9/5+32) : v; };
const cvtW = (v,i) => { if(v==="--"||v==null) return "--"; return i ? Math.round(v*.621371) : v; };
const cvtV = (v,i) => { if(v==="--"||v==null) return "--"; return i ? Math.round(v*.621371*10)/10 : v; };
const tU = i => i?"°F":"°C";
const wU = i => i?"mph":"km/h";
const vU = i => i?"mi":"km";

/* ═══════════════════════════════════════════════════════
   THEME HELPERS
═══════════════════════════════════════════════════════ */
const resolveTheme = (pref,sysDark) => {
  if(pref==="dark")  return "dark";
  if(pref==="light") return "light";
  return sysDark ? "dark" : "light";
};

const getWeatherTint = (condition) => {
  if(!condition) return null;
  const c = condition.toLowerCase();
  if(c.includes("thunder"))                    return "rgba(120,100,255,0.20)";
  if(c.includes("rain")||c.includes("drizzle"))return "rgba(70,130,255,0.16)";
  if(c.includes("snow"))                       return "rgba(190,230,255,0.14)";
  if(c.includes("fog"))                        return "rgba(180,190,200,0.14)";
  if(c.includes("clear"))                      return "rgba(255,195,100,0.14)";
  if(c.includes("cloud"))                      return "rgba(160,180,200,0.10)";
  return null;
};

/* ═══════════════════════════════════════════════════════
   MAP CONSTANTS
═══════════════════════════════════════════════════════ */
const DARK_MAP_STYLES = [
  { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
  { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
  { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
  { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
  { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
  { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#263c3f" }] },
  { featureType: "poi.park", elementType: "labels.text.fill", stylers: [{ color: "#6b9a76" }] },
  { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
  { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
  { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
  { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#746855" }] },
  { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#1f2835" }] },
  { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: "#f3d19c" }] },
  { featureType: "transit", elementType: "geometry", stylers: [{ color: "#2f3948" }] },
  { featureType: "transit.station", elementType: "labels.text.fill", stylers: [{ color: "#d59563" }] },
  { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] },
  { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#515c6d" }] },
  { featureType: "water", elementType: "labels.text.stroke", stylers: [{ color: "#17263c" }] }
];

/* ═══════════════════════════════════════════════════════
   GEOCODER
═══════════════════════════════════════════════════════ */
const _fetchWithTimeout = async (url, opts={}, ms=7000) => {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, {...opts, signal:ctrl.signal}); }
  finally { clearTimeout(timer); }
};

const geocodeWithOSM = async (query) => {
  if(!query?.trim()) throw new Error("Empty search query");
  const q = query.trim();
  try {
    const r = await _fetchWithTimeout(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`,{},6000);
    if(r.status===429) throw new Error("rate_limit");
    if(r.ok){
      const d = await r.json();
      const v = d?.results?.[0];
      if(v) return {lat:Number(v.latitude),lon:Number(v.longitude),village:(v.name||q).trim(),district:v.admin1||"",state:v.country||"",display:(v.name||q).trim()};
    }
  } catch(e){ if(e.message==="rate_limit") throw new Error("Rate limit reached. Please wait a moment."); }
  try {
    const r2 = await _fetchWithTimeout(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&addressdetails=1`,{headers:{"Accept-Language":"en","User-Agent":"BreezeWeatherApp/12"}},7000);
    if(r2.status===429) throw new Error("Rate limit (Nominatim). Please wait.");
    if(r2.ok){
      const d2 = await r2.json();
      if(d2?.length>0){
        const row=d2[0], addr=row.address||{};
        const name=addr.city||addr.town||addr.village||addr.municipality||addr.county||row.display_name.split(",")[0].trim()||q;
        return {lat:parseFloat(row.lat),lon:parseFloat(row.lon),village:name,district:addr.state_district||addr.county||addr.state||"",state:addr.country||"",display:name};
      }
    }
  } catch(e){ if(e.message.startsWith("Rate")) throw e; }
  throw new Error(`"${q}" not found. Try a nearby city.`);
};

const reverseGeocodeOSM = async (lat, lon) => {
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=en`;
    const res = await _fetchWithTimeout(url, {
      headers: {
        "Accept-Language": "en",
        "User-Agent": "BreezeWeatherApp/12"
      }
    }, 5000);
    if (res.ok) {
      const d = await res.json();
      const addr = d.address || {};
      const name = addr.city || addr.town || addr.village || addr.municipality || addr.suburb || addr.county || d.display_name.split(",")[0].trim();
      return {
        village: name,
        district: addr.state_district || addr.county || addr.state || "",
        state: addr.country || "",
        display: name
      };
    }
  } catch (e) {
    console.error("Reverse geocoding failed:", e);
  }
  return null;
};

/* ═══════════════════════════════════════════════════════
   WMO CODE MAPPER
═══════════════════════════════════════════════════════ */
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const getWeatherDetails = (code) => {
  const c = Number(code??0);
  if(c===0)          return {icon:"☀️", condition:"Clear Sky",         isStorm:false};
  if(c===1)          return {icon:"🌤️",condition:"Mostly Clear",       isStorm:false};
  if(c===2)          return {icon:"⛅",  condition:"Partly Cloudy",     isStorm:false};
  if(c===3)          return {icon:"☁️",  condition:"Overcast",          isStorm:false};
  if(c===45||c===48) return {icon:"🌫️",condition:"Foggy",              isStorm:false};
  if(c>=51&&c<=57)   return {icon:"🌦️",condition:"Drizzle",            isStorm:true };
  if(c>=61&&c<=67)   return {icon:"🌧️",condition:"Rain",               isStorm:true };
  if(c>=71&&c<=77)   return {icon:"🌨️",condition:"Snow",               isStorm:true };
  if(c>=80&&c<=82)   return {icon:"🌧️",condition:"Rain Showers",       isStorm:true };
  if(c===85||c===86) return {icon:"🌨️",condition:"Snow Showers",       isStorm:true };
  if(c===95)         return {icon:"⛈️",  condition:"Thunderstorm",      isStorm:true };
  if(c===96||c===99) return {icon:"⛈️",  condition:"Heavy Thunderstorm",isStorm:true };
  return {icon:"🌡️",condition:"Unknown",isStorm:false};
};

/* ═══════════════════════════════════════════════════════
   FETCH WEATHER
═══════════════════════════════════════════════════════ */
const fetchWeather = async (lat, lon) => {
  try {
    const wUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,surface_pressure,dew_point_2m,uv_index,visibility&hourly=temperature_2m,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_sum,sunrise,sunset,wind_speed_10m_max&timezone=auto&forecast_days=7`;
    const aqUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=european_aqi,pm10,pm2_5`;
    const wCtrl=new AbortController(), aqCtrl=new AbortController();
    const wT=setTimeout(()=>wCtrl.abort(),10000), aqT=setTimeout(()=>aqCtrl.abort(),8000);
    let wRes,aqRes;
    try {
      [wRes,aqRes] = await Promise.all([
        fetch(wUrl,{signal:wCtrl.signal}),
        fetch(aqUrl,{signal:aqCtrl.signal}).catch(e=>{return null;}),
      ]);
    } finally { clearTimeout(wT); clearTimeout(aqT); }
    if(!wRes.ok) throw new Error(`Weather API ${wRes.status}`);
    const [wData,aqData] = await Promise.all([wRes.json(), aqRes?.json().catch(()=>null)]);

    const c=wData.current||{};
    const wd=getWeatherDetails(c.weather_code);
    const nr=v=>v!=null?Math.round(v):"--";
    const nf=(v,d=1)=>v!=null?Number(v.toFixed(d)):"--";

    const currentWeather = {
      temperature:nr(c.temperature_2m), feelslike:nr(c.apparent_temperature),
      humidity:nr(c.relative_humidity_2m), precipitation:nf(c.precipitation),
      windspeed:nr(c.wind_speed_10m), pressure:nr(c.surface_pressure),
      dewPoint:nr(c.dew_point_2m), uv_index:nr(c.uv_index),
      visibility:c.visibility!=null?nr(c.visibility/1000):"--", 
      icon:wd.icon, condition:wd.condition, isStorm:wd.isStorm, conditionCode:wd.isStorm?"storm":"clear",
    };

    const hTimes=wData.hourly?.time||[];
    const targetLocalTime = c.time || new Date().toISOString().slice(0,16);
    const targetHour = targetLocalTime.slice(0,13); 
    let si=hTimes.findIndex(t=>t.slice(0,13)>=targetHour); if(si<0)si=0;
    
    const hourly=hTimes.slice(si,si+24).map((t,i)=>{
      const idx=si+i, hwd=getWeatherDetails(wData.hourly.weather_code?.[idx]), hr=parseInt(t.slice(11,13),10);
      return {time:String(hr).padStart(2,"0")+":00",temp:nr(wData.hourly.temperature_2m?.[idx]),icon:hwd.icon,condition:hwd.condition,precipitation:nf(wData.hourly.precipitation?.[idx]),windspeed:nr(wData.hourly.wind_speed_10m?.[idx])};
    });

    const dTimes=wData.daily?.time||[];
    const daily=dTimes.map((t,i)=>{
      const [yy,mm,dd] = t.split("-").map(Number);
      const d = new Date(yy, mm-1, dd); 
      const dwd=getWeatherDetails(wData.daily.weather_code?.[i]);
      const srRaw=(wData.daily.sunrise?.[i]||"").slice(11,16)||"06:00";
      const ssRaw=(wData.daily.sunset?.[i]||"").slice(11,16)||"18:00";
      const toMin=s=>{try{const[h,m]=(s||"00:00").split(":").map(Number);return h*60+m;}catch{return 0;}};
      const dl=((toMin(ssRaw)-toMin(srRaw))/60).toFixed(1);
      const precip=nf(wData.daily.precipitation_sum?.[i]);
      const dayHours=[];
      hTimes.forEach((ht,hi)=>{
        if(!ht.startsWith(t))return;
        const hr=parseInt(ht.slice(11,13),10);
        if(![6,9,12,15,18,21].includes(hr))return;
        const hwd2=getWeatherDetails(wData.hourly.weather_code?.[hi]);
        dayHours.push({time:String(hr).padStart(2,"0")+":00",temp:nr(wData.hourly.temperature_2m?.[hi]),icon:hwd2.icon,precipitation:nf(wData.hourly.precipitation?.[hi])});
      });
      return {
        name:i===0?"Today":DAYS[d.getDay()],
        lo:nr(wData.daily.temperature_2m_min?.[i]),hi:nr(wData.daily.temperature_2m_max?.[i]),
        icon:dwd.icon,condition:dwd.condition,
        windSpeed:nr(wData.daily.wind_speed_10m_max?.[i]),
        humidity:nr(c.relative_humidity_2m),uvIndex:nr(wData.daily.uv_index_max?.[i]),
        pressure:nr(c.surface_pressure),dewPoint:nr(c.dew_point_2m),
        precipitation:precip,
        summary:dwd.condition+(precip>0?` · ${precip} mm expected.`:" · Dry conditions."),
        hours:dayHours,sunrise:srRaw,sunset:ssRaw,daylight_hours:parseFloat(dl),
      };
    });

    const aq=aqData?.current||{};
    const aqi={
      value:aq.european_aqi!=null?Math.round(aq.european_aqi):null,
      pollutant:(aq.pm2_5!=null&&aq.pm10!=null)?(aq.pm2_5>=aq.pm10?"PM2.5":"PM10"):"AQI",
      pm2_5:aq.pm2_5!=null?Math.round(aq.pm2_5*10)/10:null,
      pm10:aq.pm10!=null?Math.round(aq.pm10*10)/10:null,
    };
    const d0=daily[0]||{};
    const sun_moon={sunrise:d0.sunrise||"06:00",sunset:d0.sunset||"18:00",daylight_hours:d0.daylight_hours||12,moon_emoji:"🌙"};
    const tzParts=(wData.timezone||"Asia/Kolkata").split("/");
    const locationFromApi={village:(tzParts[1]||"Location").replace(/_/g," "),district:tzParts[0]||"",state:""};
    return {currentWeather,hourly,daily,aqi,sun_moon,locationFromApi};
  } catch(e){ return null; }
};

/* ═══════════════════════════════════════════════════════
   MAP HERO
═══════════════════════════════════════════════════════ */
const MapHero=({isDark,coords,activeLocation,lowSig,onDisableLowSig})=>{
  const mapRef=useRef(null), instRef=useRef(null), markerRef=useRef(null);
  const [isOffline,setIsOffline]=useState(!navigator.onLine);

  useEffect(()=>{
    const goOff=()=>setIsOffline(true);
    const goOn=()=>setIsOffline(false);
    window.addEventListener('online',goOn);
    window.addEventListener('offline',goOff);
    return()=>{window.removeEventListener('online',goOn);window.removeEventListener('offline',goOff);};
  },[]);

  useEffect(()=>{
    if(lowSig) return;
    let attempts=0,fallbackTimer=null,tilesListener=null,retryTimer=null,unmounted=false;
    const tryInit= async ()=>{
      try{
        if(unmounted||!mapRef.current) return;
        if(!window.google || !window.google.maps) {
          await loadGoogleMaps().catch(()=>{});
        }
        if(!window.google||!window.google.maps||typeof window.google.maps.Map!=="function"){
          if(++attempts<100) retryTimer=setTimeout(tryInit,100);
          return;
        }
        if(instRef.current) return;
        const lat=coords?.lat!=null?Number(coords.lat):11.5728, lng=coords?.lon!=null?Number(coords.lon):76.0808;
        const map=new window.google.maps.Map(mapRef.current,{
          center:{lat,lng},zoom:13.5,
          tilt:window.innerWidth>768?67:0,heading:45,
          disableDefaultUI:true,
          gestureHandling:"none",
          zoomControl:false,
          scrollwheel:false,
          keyboardShortcuts:false,clickableIcons:false,
          styles:isDark?DARK_MAP_STYLES:[],
        });
        instRef.current=map;
        markerRef.current=new window.google.maps.Marker({
          position:{lat,lng},map,title:activeLocation?.village||"Breeze",
          animation:(window.google.maps.Animation&&window.google.maps.Animation.DROP)||null,
          icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:8,fillColor:"#48C6EF",fillOpacity:1,strokeColor:"white",strokeWeight:2.5},
        });
        tilesListener=map.addListener("tilesloaded",()=>{if(!unmounted&&mapRef.current) mapRef.current.classList.add("loaded");});
        fallbackTimer=setTimeout(()=>{if(!unmounted&&mapRef.current) mapRef.current.classList.add("loaded");},3000);
      }catch(e){}
    };
    tryInit();
    return()=>{
      unmounted=true;
      if(retryTimer) clearTimeout(retryTimer);
      if(fallbackTimer) clearTimeout(fallbackTimer);
      if(tilesListener){if(tilesListener.remove)tilesListener.remove();else if(window.google?.maps?.event)window.google.maps.event.removeListener(tilesListener);}
      if(markerRef.current) markerRef.current.setMap(null);
    };
  },[lowSig]);

  useEffect(()=>{
    if(lowSig) return;
    try{
      const map=instRef.current; if(!map) return;
      const lat=coords?.lat!=null?Number(coords.lat):11.5728, lng=coords?.lon!=null?Number(coords.lon):76.0808;
      map.panTo({lat,lng});
      const _tiltTimer=setTimeout(()=>{if(instRef.current&&typeof instRef.current.setTilt==="function") instRef.current.setTilt(window.innerWidth>768?67:0);},600);
      if(markerRef.current){markerRef.current.setPosition({lat,lng});markerRef.current.setTitle(activeLocation?.village||"Breeze");}
      return()=>clearTimeout(_tiltTimer);
    }catch(e){}
  },[coords?.lat,coords?.lon]);

  useEffect(()=>{
    if(lowSig) return;
    try{
      const map=instRef.current;
      if(!map) return;
      map.setOptions({styles:isDark?DARK_MAP_STYLES:[]});
      const center=map.getCenter();
      if(center) map.setCenter(center);
    }catch(e){}
  },[isDark]);

  if(lowSig){
    return(
      <div style={{height:"220px",borderRadius:"20px",background:"linear-gradient(160deg,#1a2a4a,#0d1828)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"20px",border:"1px solid var(--border-light)",position:"relative"}}>
        <button onClick={onDisableLowSig} style={{
          position:"absolute",top:"14px",right:"14px",
          width:"34px",height:"34px",borderRadius:"50%",
          background:"var(--thin)",border:"1px solid var(--border-light)",
          display:"flex",alignItems:"center",justifyContent:"center",
          cursor:"pointer",flexShrink:0,lineHeight:0,padding:0,
        }}>
          <I.X s={16} c="var(--text-main)"/>
        </button>
        <div style={{marginBottom:"10px",opacity:0.5}}><I.Wifi0 s={28} c="var(--text-main)"/></div>
        <span style={{fontSize:"13px",fontWeight:600,color:"var(--text-main)",marginBottom:"4px"}}>Low Signal Mode</span>
        <span style={{fontSize:"11.5px",color:"var(--text-dim)",textAlign:"center",maxWidth:"200px",lineHeight:"1.5"}}>Map and animations disabled to save data</span>
      </div>
    );
  }

  return(
    <div className="map-wrap">
      <div ref={mapRef} className="map-canvas" style={{filter:isDark?"brightness(0.95)":"brightness(0.95)"}}/>
      {isOffline&&(
        <div style={{
          position:"absolute",inset:0,borderRadius:"inherit",zIndex:5,
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          background:"rgba(10,15,30,0.82)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",
          gap:"8px",pointerEvents:"none",
        }}>
          <I.Wifi0 s={28} c="rgba(255,255,255,0.5)"/>
          <span style={{fontSize:"13px",fontWeight:600,color:"rgba(255,255,255,0.8)"}}>You are offline</span>
          <span style={{fontSize:"11px",color:"rgba(255,255,255,0.45)",textAlign:"center",maxWidth:"220px",lineHeight:"1.5"}}>Turn on the internet to load the map and get new weather updates</span>
        </div>
      )}
    </div>
  );
};

/* ═══════════════════════════════════════════════════════
   SEARCH BAR
═══════════════════════════════════════════════════════ */
const SearchBar=({location,onSearch,onSelectSuggestion,onSettings,onLocate,loading})=>{
  const [q,setQ]=useState("");
  const [suggestions, setSuggestions] = useState([]);
  const [showSuggest, setShowSuggest] = useState(false);
  const inputRef = useRef(null);
  const containerRef = useRef(null);

  // Debounced autocomplete search using Photon API (OpenStreetMap data)
  useEffect(() => {
    if (q.trim().length < 1) {
      setSuggestions([]);
      return;
    }
    const delayDebounceFn = setTimeout(async () => {
      try {
        const response = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q.trim())}&limit=5`);
        if (response.ok) {
          const data = await response.json();
          setSuggestions(data.features || []);
        }
      } catch (err) {
        console.error("Autocomplete error:", err);
      }
    }, 300); // 300ms debounce

    return () => clearTimeout(delayDebounceFn);
  }, [q]);

  // Click outside to close suggestions
  useEffect(() => {
    const handleOutsideClick = (e) => {
      if (containerRef.current && !containerRef.current.contains(e.target)) {
        setShowSuggest(false);
      }
    };
    document.addEventListener("click", handleOutsideClick);
    return () => document.removeEventListener("click", handleOutsideClick);
  }, []);

  const submit=e=>{
    e.preventDefault();
    const v=q.trim();
    if(!v)return;
    onSearch(v);
    setQ("");
    setSuggestions([]);
    setShowSuggest(false);
    if(inputRef.current) {
      inputRef.current.blur();
    }
  };

  const handleSelect = (item) => {
    onSelectSuggestion(item);
    setQ("");
    setSuggestions([]);
    setShowSuggest(false);
    if(inputRef.current) {
      inputRef.current.blur();
    }
  };

  return(
    <div ref={containerRef} style={{position:"relative", zIndex: 10, width: "100%"}}>
      <form onSubmit={submit} style={{display:"flex",alignItems:"center",gap:"0",overflow:"hidden"}} className="material m-regular">
        <div style={{padding:"0 12px",flexShrink:0,display:"flex",alignItems:"center"}}>
          {loading
            ? <div className="spin" style={{width:"14px",height:"14px",borderRadius:"50%",border:"2px solid rgba(72,198,239,.3)",borderTopColor:"#48C6EF"}}/>
            : <I.Search s={14} c="var(--text-sub)"/>}
        </div>
        <input 
          ref={inputRef}
          type="search" 
          className="srch" 
          value={q} 
          onChange={e=>{setQ(e.target.value); setShowSuggest(true);}}
          onFocus={()=>setShowSuggest(true)}
          placeholder={location?.display||location?.village||"Search location…"}
          enterKeyHint="search" 
          autoComplete="off" 
          spellCheck="false"
          style={{flex:1,padding:"12px 0",background:"transparent",border:"none",outline:"none",color:"var(--text-main)",fontSize:"14px",fontFamily:"'DM Sans',sans-serif"}}/>
        <button type="button" onClick={onLocate} title="Use Current Location"
          style={{padding:"12px 12px",background:"none",border:"none",borderLeft:"1px solid var(--border-light)",cursor:"pointer",display:"flex",alignItems:"center",flexShrink:0}}>
          <I.Loc s={16} c="var(--text-sub)"/>
        </button>
        <button type="button" onClick={onSettings} title="Settings"
          style={{padding:"12px 14px",background:"none",border:"none",borderLeft:"1px solid var(--border-light)",cursor:"pointer",display:"flex",alignItems:"center",flexShrink:0}}>
          <I.Cog s={17} c="var(--text-sub)"/>
        </button>
      </form>

      {showSuggest && suggestions.length > 0 && (
        <div className="glass m-thick panel-in" style={{
          position: "absolute",
          top: "calc(100% + 8px)",
          left: 0,
          right: 0,
          zIndex: 11,
          maxHeight: "260px",
          overflowY: "auto",
          padding: "8px",
          display: "flex",
          flexDirection: "column",
          gap: "4px",
          boxShadow: "0 12px 30px rgba(0,0,0,0.35)",
          backdropFilter: "blur(20px)",
          WebkitBackdropFilter: "blur(20px)",
          border: "1px solid var(--border-light)",
          borderRadius: "16px"
        }}>

/* ═══════════════════════════════════════════════════════
   SMART WEATHER TIP  (desktop left sidebar)
═══════════════════════════════════════════════════════ */
const WeatherTip=({cw,imp})=>{
  const temp=cw.temperature, uv=cw.uv_index, humidity=cw.humidity,
        wind=cw.windspeed, precip=cw.precipitation, code=cw.conditionCode;
  const tips=[];
  if(precip>0)                       tips.push({e:"☂️",t:"Carry an umbrella — rain expected"});
  else if(code==="storm")            tips.push({e:"⚡",t:"Storm conditions — stay indoors if possible"});
  else if(uv!=="--"&&uv>=8)         tips.push({e:"🔆",t:"Very high UV — wear sunscreen & sunglasses"});
  else if(uv!=="--"&&uv>=6)         tips.push({e:"🧴",t:"High UV today — apply sunscreen outdoors"});
  if(humidity!=="--"&&humidity>80)   tips.push({e:"💧",t:"High humidity — stay hydrated"});
  if(wind!=="--"&&wind>40)           tips.push({e:"🌬️",t:"Strong winds — secure loose objects"});
  const rawT=Number(temp);
  if(!isNaN(rawT)){
    if(rawT<5)       tips.push({e:"🧥",t:"Near freezing — bundle up in layers"});
    else if(rawT<15) tips.push({e:"🧣",t:"Cool day — a jacket is a good idea"});
    else if(rawT>35) tips.push({e:"🥵",t:"Very hot — avoid midday sun, drink water"});
    else if(rawT>28) tips.push({e:"😎",t:"Warm and sunny — great for outdoor plans"});
    else             tips.push({e:"🌤️",t:"Pleasant conditions today"});
  }
  const tip=tips[0]||{e:"🌍",t:"Stay weather-aware"};
  return(
    <G level={1} style={{padding:"14px 16px",background:"linear-gradient(135deg,rgba(72,198,239,0.08),rgba(72,198,239,0.03))",border:"1px solid rgba(72,198,239,0.2)"}}>
      <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
        <span style={{fontSize:"26px",lineHeight:1,flexShrink:0}}>{tip.e}</span>
        <div>
          <div style={{fontSize:"10px",color:"#48C6EF",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"4px"}}>Today's Tip</div>
          <div style={{fontSize:"13px",color:"var(--text-main)",lineHeight:1.45,fontWeight:500}}>{tip.t}</div>
        </div>
      </div>
    </G>
  );
};

/* ═══════════════════════════════════════════════════════
   7-DAY TEMPERATURE TREND CHART  (desktop right sidebar)
═══════════════════════════════════════════════════════ */
const TempTrendChart=({daily,imp})=>{
  if(!daily?.length) return null;
  const W=280,H=110,PAD={t:20,b:28,l:8,r:8};
  const iW=W-PAD.l-PAD.r, iH=H-PAD.t-PAD.b;
  const toNum=v=>{ const n=typeof v==="number"?v:parseFloat(v); return isNaN(n)?null:n; };
  const hiVals=daily.map(d=>toNum(d.hi)??0);
  const loVals=daily.map(d=>toNum(d.lo)??0);
  const allVals=[...hiVals,...loVals];
  const minV=Math.min(...allVals)-2, maxV=Math.max(...allVals)+2;
  const range=maxV-minV||1;
  const n=daily.length;
  const xOf=i=>PAD.l+(i/(n-1))*iW;
  const yOf=v=>PAD.t+iH-(((imp?toNum(cvtT(v,imp))??v:v)-minV)/range)*iH;
  const curve=arr=>{
    return arr.map((v,i)=>{
      const x=xOf(i), y=yOf(v);
      if(i===0) return `M ${x.toFixed(1)} ${y.toFixed(1)}`;
      const px=xOf(i-1), py=yOf(arr[i-1]), cx=(px+x)/2;
      return `C ${cx.toFixed(1)} ${py.toFixed(1)} ${cx.toFixed(1)} ${y.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(" ");
  };
  const hiPath=curve(hiVals);
  const loPath=curve(loVals);
  const areaPath=hiPath+
    ` L ${xOf(n-1).toFixed(1)} ${yOf(loVals[n-1]).toFixed(1)}`+
    loVals.slice().reverse().map((v,i)=>{
      const ri=n-1-i, x=xOf(ri), y=yOf(v);
      if(i===0) return ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
      const nx=xOf(ri+1), ny=yOf(loVals[ri+1]), cx=(nx+x)/2;
      return ` C ${cx.toFixed(1)} ${ny.toFixed(1)} ${cx.toFixed(1)} ${y.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join("")+" Z";
  return(
    <div>
      <SL t="7-Day Temp Trend"/>
      <G level={2} style={{padding:"14px 16px"}}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",overflow:"visible"}}>
          <defs>
            <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#48C6EF" stopOpacity="0.22"/>
              <stop offset="100%" stopColor="#48C6EF" stopOpacity="0.01"/>
            </linearGradient>
          </defs>
          {[0,0.5,1].map((f,i)=>(
            <line key={i} x1={PAD.l} y1={PAD.t+iH*f} x2={W-PAD.r} y2={PAD.t+iH*f}
              stroke="var(--border-light)" strokeWidth="0.5" strokeDasharray="3 3"/>
          ))}
          <path d={areaPath} fill="url(#trendGrad)"/>
          <path d={loPath} fill="none" stroke="rgba(72,198,239,0.35)" strokeWidth="1.5" strokeLinecap="round"/>
          <path d={hiPath} fill="none" stroke="#48C6EF" strokeWidth="2" strokeLinecap="round"/>
          {daily.map((d,i)=>{
            const x=xOf(i), hyVal=hiVals[i];
            const displayHi=imp?cvtT(hyVal,imp):hyVal;
            const displayLo=imp?cvtT(loVals[i],imp):loVals[i];
            return(
              <g key={i}>
                <text x={x} y={H-4} textAnchor="middle" fill="var(--text-dim)" fontSize="7.5" fontFamily="DM Sans,sans-serif">
                  {d.name.slice(0,3).toUpperCase()}
                </text>
                <circle cx={x} cy={yOf(hyVal)} r="2.5" fill="#48C6EF"/>
                <text x={x} y={yOf(hyVal)-7} textAnchor="middle" fill="var(--text-main)" fontSize="8" fontFamily="Urbanist,sans-serif" fontWeight="700">
                  {displayHi}°
                </text>
              </g>
            );
          })}
        </svg>
        <div style={{display:"flex",gap:"14px",justifyContent:"flex-end",marginTop:"6px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
            <div style={{width:"14px",height:"2px",borderRadius:"1px",background:"#48C6EF"}}/>
            <span style={{fontSize:"10px",color:"var(--text-dim)"}}>High</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:"5px"}}>
            <div style={{width:"14px",height:"2px",borderRadius:"1px",background:"rgba(72,198,239,0.35)"}}/>
            <span style={{fontSize:"10px",color:"var(--text-dim)"}}>Low</span>
          </div>
        </div>
      </G>
    </div>
  );
};

                <div style={{display:"flex",gap:"8px",alignItems:"center",flexShrink:0,marginRight:"8px"}}>
                  <span style={{fontFamily:"'Urbanist',sans-serif",fontSize:"14px",color:"var(--text-sub)"}}>{cvtT(day.lo,imp)}{tU(imp)}</span>
                  <span style={{fontFamily:"'Urbanist',sans-serif",fontSize:"14px",fontWeight:600,color:"var(--text-main)"}}>{cvtT(day.hi,imp)}{tU(imp)}</span>
                </div>
                <div style={{transition:"transform .25s ease",transform:isOpen?"rotate(0)":"rotate(180deg)",flexShrink:0}}>
                  <I.Up s={13} c="var(--text-sub)"/>
                </div>
              </button>

              <div className={`acc-body${isOpen?" open":""}`}>
                <div className="acc-inner" style={{background:"transparent"}}>
                  {day.hours?.length>0&&(
                    <div className="no-scroll" style={{display:"flex",gap:"7px",overflowX:"auto",padding:"10px 16px 6px"}}>
                      {day.hours.map((h,j)=>(
                        <div key={j} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"4px",minWidth:"50px",padding:"8px 6px",borderRadius:"12px",background:"transparent",border:"1px solid var(--border-light)",flexShrink:0}}>
                          <span style={{fontSize:"10px",color:"var(--text-sub)"}}>{h.time}</span>
                          <span style={{fontSize:"16px"}}>{h.icon}</span>
                          <span style={{fontFamily:"'Urbanist',sans-serif",fontSize:"13px",fontWeight:600,color:"var(--text-main)"}}>{cvtT(h.temp,imp)}°</span>
                          {h.precipitation>0&&<span style={{fontSize:"9px",color:"rgba(100,200,255,0.8)"}}>{h.precipitation}mm</span>}
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"7px",padding:"6px 16px 14px"}}>
                    {[
                      {label:"UV Index",value:day.uvIndex,note:day.uvIndex!=="--"?(day.uvIndex>=8?"Very High":day.uvIndex>=6?"High":"Moderate"):""},
                      {label:"Wind",value:`${cvtW(day.windSpeed,imp)} ${wU(imp)}`,note:""},
                      {label:"Humidity",value:day.humidity!=null?`${day.humidity}%`:"—",note:""},
                      {label:"Precipitation",value:`${day.precipitation} mm`,note:""},
                    ].map(({label,value,note},j)=>(
                      <div key={j} style={{padding:"10px 12px",borderRadius:"12px",background:"transparent",border:"1px solid var(--border-light)"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"5px"}}>
                          <span style={{fontSize:"10px",color:"var(--text-sub)",textTransform:"uppercase",letterSpacing:"0.06em"}}>{label}</span>
                          {note&&<span style={{fontSize:"9px",color:"var(--text-dim)"}}>{note}</span>}
                        </div>
                        <div style={{fontFamily:"'Urbanist',sans-serif",fontSize:"17px",fontWeight:600,color:"var(--text-main)"}}>{value}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{margin:"0 16px 12px",padding:"10px 12px",borderRadius:"10px",background:"rgba(72,198,239,0.08)",border:"1px solid rgba(72,198,239,0.18)"}}>
                    <div style={{fontSize:"12px",color:"var(--text-sub)",lineHeight:"1.6"}}>{day.summary}</div>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
      </M>
    </div>
  );
};

const SettingsPanel=({open,onClose,imp,setImp,lowSig,setLowSig,themePref,setThemePref,notifPerm,onRequestNotif,geoState,locationEnabled,onToggleLocation})=>{
  const [showLegal,setShowLegal]=useState(false);
  if(!open) return null;

  const Row=({Icon,title,sub,right,last=false})=>(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 0",borderBottom:last?"none":"1px solid var(--divider)"}}>

        {Icon&&<div style={{width:"30px",height:"30px",borderRadius:"8px",background:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon s={14} c="var(--text-sub)"/></div>}
        <div>
          <div style={{fontSize:"14px",fontWeight:500,color:"var(--text-main)"}}>{title}</div>

  return(
    <>
      <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)",zIndex:9000}}/>
      <div className="panel-in" style={{position:"fixed",top:0,right:0,bottom:0,width:"min(360px,94vw)",background:"rgba(20,25,40,0.88)",borderLeft:"1px solid var(--border-light)",zIndex:9001,overflowY:"auto",paddingBottom:"max(24px,var(--sab,24px))"}}>
        {!showLegal&&<>
        <PanelHeader title="Settings" subtitle="Breeze v0.12.0" onBack={onClose}/>
        <div style={{padding:"0 24px"}}>
          
          <Cat c="Appearance"/>
          <div style={{padding:"12px 0",borderBottom:"1px solid var(--divider)"}}>
            <div style={{fontSize:"13px",fontWeight:500,color:"var(--text-main)",marginBottom:"12px"}}>Theme</div>
            <SegCtrl options={THEME_OPTS} value={themePref} onChange={setThemePref}/>
          </div>
          
          <Cat c="Units"/>
          <Row Icon={I.Sun2} title="Measurement" sub={imp?"Imperial — °F, mph":"Metric — °C, km/h"}
            right={<div style={{display:"flex",alignItems:"center",gap:"8px"}}><span style={{fontSize:"11px",color:"var(--text-sub)"}}>{imp?"°F":"°C"}</span><Toggle on={imp} onChange={setImp}/></div>}/>
          
          <Cat c="Connectivity"/>
          <Row Icon={I.Wifi0} title="Low Signal Mode" sub="Disables map, strips animations"
            right={<Toggle on={lowSig} onChange={(v) => {
              setLowSig(v);
              if (v) {
                onClose();
                window.scrollTo({ top: 0, behavior: 'instant' });
              }
            }}/>} />
            
          <Cat c="Location"/>
          <Row Icon={I.Pin} title="Location Access"
            sub={locationEnabled?(geoState==="got"?"Location active":"Requesting location…"):"Disabled — using last known location"}
            right={<Toggle on={locationEnabled} onChange={onToggleLocation}/>} />
          {!locationEnabled&&(
            <div style={{padding:"10px 14px",borderRadius:"12px",background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",marginBottom:"6px"}}>
              <span style={{fontSize:"11.5px",color:"#fca5a5",lineHeight:"1.5"}}>Location is turned off. Enable the toggle above to get weather for your current location.</span>
            </div>
          )}
            
          <Cat c="About"/>
          <div onClick={()=>setShowLegal(true)} style={{cursor:"pointer"}}>
            <Row Icon={I.Leaf} title="Data Sources & Legal" sub="Open-Meteo · OSM · Google Maps"
              right={<I.Chev s={13} c="#48C6EF"/>} last/>

        </div>
        </>}
      </div>

      {showLegal&&(
        <div className="panel-in" style={{position:"fixed",top:0,right:0,bottom:0,width:"min(360px,94vw)",background:"rgba(20,25,40,0.88)",borderLeft:"1px solid var(--border-light)",zIndex:9002,overflowY:"auto",paddingBottom:"max(24px,var(--sab,24px))"}}>
          <PanelHeader title="Legal & Data Sources" onBack={()=>setShowLegal(false)}/>
          <div style={{padding:"0 24px"}}>
            {[
              {title:"Weather Forecasts",src:"Open-Meteo",url:"https://open-meteo.com",license:"CC BY 4.0",desc:"Free weather API — no API key required."},
              {title:"Location Fetching",src:"W3C Geolocation API",url:"https://developer.mozilla.org/en-US/docs/Web/API/Geolocation_API",license:"Browser Native",desc:"HTML5 native browser geolocation API."},
              {title:"Autocomplete Suggestions",src:"Photon (Komoot)",url:"https://photon.komoot.io",license:"ODbL",desc:"Search autocomplete powered by OpenStreetMap contributors."},
              {title:"Geocoding",src:"OpenStreetMap Nominatim",url:"https://nominatim.openstreetmap.org",license:"ODbL",desc:"© OpenStreetMap contributors."},
              {title:"3D Maps",src:"Google Maps Platform",url:"https://maps.google.com",license:"Google Terms",desc:"WebGL vector maps."},
              {title:"Air Quality",src:"Open-Meteo AQI",url:"https://open-meteo.com/en/docs/air-quality-api",license:"CC BY 4.0",desc:"European AQI via Copernicus CAMS."},
            ].map(({title,src,url,license,desc},i)=>(
              <div key={i} style={{padding:"14px 0",borderBottom:"1px solid var(--divider)"}}>

      )}
    </>
  );
};

/* ═══════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════ */
const App=()=>{
  const [imp,setImp]=useState(()=>localStorage.getItem("bz_imp")==="true");
  const [themePref,setThemePref]=useState(()=>localStorage.getItem("bz_theme")||"system");
  const [lowSig,setLowSig]=useState(()=>localStorage.getItem("bz_lowsig")==="true");
  const [sysDark,setSysDark]=useState(()=>window.matchMedia("(prefers-color-scheme:dark)").matches);
  const [settOpen,setSettOpen]=useState(false);

  const [coords,setCoords]=useState(()=>{
    try {
      const last = localStorage.getItem("bz_last_coords");
      if (last) return JSON.parse(last);
    } catch(e) {}
    return {lat:11.5728,lon:76.0808};
  });
  const [geoState,setGeoState]=useState("pending");
  const [activeLocation,setActiveLocation]=useState(()=>{
    try {
      const last = localStorage.getItem("bz_last_location");
      if (last) return JSON.parse(last);
    } catch(e) {}
    return null;
  });

  const [liveWeather,setLiveWeather]=useState(null);
  const [liveHourly,setLiveHourly]=useState([]);
  const [liveDaily,setLiveDaily]=useState([]);
  const [liveAqi,setLiveAqi]=useState(null);
  const [liveSunMoon,setLiveSunMoon]=useState(null);
  const [weatherLoading,setWeatherLoading]=useState(true);
  const [weatherError,setWeatherError]=useState(null);
  const [searchError,setSearchError]=useState(null);
  const didSearchRef = useRef(false);

  // Location toggle state — persisted
  const [locationEnabled,setLocationEnabled]=useState(()=>{
    const saved=localStorage.getItem("bz_location_enabled");
    return saved!==null?saved==="true":true; // default ON
  });
  useEffect(()=>{ localStorage.setItem("bz_location_enabled",locationEnabled); },[locationEnabled]);

  useEffect(()=>{ localStorage.setItem("bz_imp",imp); },[imp]);
  useEffect(()=>{ localStorage.setItem("bz_theme",themePref); },[themePref]);
  useEffect(()=>{ localStorage.setItem("bz_lowsig",lowSig); },[lowSig]);

  useEffect(()=>{
    const dark=resolveTheme(themePref,sysDark)==="dark";
    document.documentElement.setAttribute("data-theme",dark?"dark":"light");
    if(lowSig) document.documentElement.classList.add("low-signal");
    else document.documentElement.classList.remove("low-signal");
  },[themePref,sysDark,lowSig]);

  // Lock background scroll when settings panel is open
  useEffect(()=>{
    if(settOpen){
      document.body.style.overflow="hidden";
      document.body.style.touchAction="none";
    } else {
      document.body.style.overflow="";
      document.body.style.touchAction="";
    }
    return()=>{
      document.body.style.overflow="";
      document.body.style.touchAction="";
    };
  },[settOpen]);

  const fetchGeoLocation = useCallback(async (isManual = false) => {
    if (!navigator.geolocation) {
      setGeoState("unsupported");
      if (isManual) {
        setSearchError("Geolocation is not supported by your browser.");
      }
      return;
    }

    setWeatherLoading(true);
    setSearchError(null);

    navigator.geolocation.getCurrentPosition(
      async pos => {
        if (didSearchRef.current) {
          setGeoState("got");
          return;
        }
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        setGeoState("got");
        
        // Reset active location only if the coordinates changed to trigger reverse geocoding in weather load
        setCoords(prev => {
          if (prev.lat !== lat || prev.lon !== lon) {
            setActiveLocation(null);
            return { lat, lon };
          }
          return prev;
        });
      },
      err => {
        console.warn("Geolocation error:", err);
        setGeoState("denied");
        setWeatherLoading(false);
        if (isManual) {
          if (err.code === 1) {
            setSearchError("Location access denied. Open Settings (⚙️) and turn on the Location toggle, or allow location in your browser's site settings.");
          } else if (err.code === 2) {
            setSearchError("Location unavailable. Please check your device's GPS or connection.");
          } else if (err.code === 3) {
            setSearchError("Location request timed out. Please try again.");
          } else {
            setSearchError("Location access denied. Open Settings (⚙️) and turn on the Location toggle.");
          }
        }
      },
      { enableHighAccuracy: false, timeout: 5000, maximumAge: 300000 }
    );
  }, []);

  // Toggle location on/off from Settings
  const handleToggleLocation = useCallback((on)=>{
    setLocationEnabled(on);
    if(on){
      didSearchRef.current=false;
      setSearchError(null);
      fetchGeoLocation(true);
    } else {
      setGeoState("denied");
    }
  },[fetchGeoLocation]);

  useEffect(() => {
    if(locationEnabled) fetchGeoLocation(false);
    else { setGeoState("denied"); setWeatherLoading(false); }
  }, [fetchGeoLocation, locationEnabled]);

  useEffect(()=>{
    if (geoState === "pending") return;
    const load=async()=>{
      setWeatherLoading(true);
      const data=await fetchWeather(coords.lat,coords.lon);
      if(data){
        setLiveWeather(data.currentWeather);setLiveHourly(data.hourly);
        setLiveDaily(data.daily);setLiveAqi(data.aqi);setLiveSunMoon(data.sun_moon);
        
        let currentLoc = activeLocation;
        if(!currentLoc) {
          try {
            const loc = await reverseGeocodeOSM(coords.lat, coords.lon);
            if (loc) {
              currentLoc = loc;
              setActiveLocation(loc);
            } else {
              currentLoc = {...data.locationFromApi,display:data.locationFromApi.village};
              setActiveLocation(currentLoc);
            }
          } catch(e) {
            currentLoc = {...data.locationFromApi,display:data.locationFromApi.village};
            setActiveLocation(currentLoc);
          }
        }
        
        // Save successfully loaded coordinates and location to localStorage
        try {
          localStorage.setItem("bz_last_coords", JSON.stringify(coords));
          if (currentLoc) {
            localStorage.setItem("bz_last_location", JSON.stringify(currentLoc));
          }
        } catch(e) {}
      } else {
        setWeatherError("Could not load weather data.");
      }
      setWeatherLoading(false);
    };
    load();
  },[coords.lat,coords.lon,geoState]);

  const isDark=resolveTheme(themePref,sysDark)==="dark";
  const cw=liveWeather||{temperature:"--",feelslike:"--",humidity:"--",windspeed:"--",uv_index:"--",visibility:"--",precipitation:"--",pressure:"--",dewPoint:"--",icon:"🌡️",condition:"Loading…"};
  const aqi=liveAqi||{value:null,pollutant:"AQI"};
  const sun_moon=liveSunMoon||{sunrise:"06:00",sunset:"18:00",daylight_hours:12};

  const handleSearch=useCallback(async q=>{
    if(!q?.trim()) return;
    setWeatherLoading(true);
    setSearchError(null);
    didSearchRef.current = true;
    setGeoState("got");
    try{
      const geo=await geocodeWithOSM(q);
      setCoords({lat:geo.lat,lon:geo.lon});
      setActiveLocation({village:geo.village,district:geo.district,state:geo.state,display:geo.display});
    }catch(e){
      setSearchError(e.message);
      setWeatherLoading(false);
    }
  },[]);

  const handleSelectSuggestion = useCallback(item => {
    setSearchError(null);
    didSearchRef.current = true;
    setGeoState("got");
    setCoords({ lat: item.latitude, lon: item.longitude });
    setActiveLocation({
      village: item.name,
      district: item.admin1 || "",
      state: item.country || "",
      display: item.name
    });
  }, []);

  return(
    <div style={{minHeight:"100vh"}}>

      {/* ════════════════════════════════════════════
          MOBILE LAYOUT  (hidden on desktop ≥1024px)
          Exact original single-column flow
      ════════════════════════════════════════════ */}
      <div className="mobile-layout">
        <div style={{minHeight:"100dvh",padding:"16px",paddingTop:"calc(var(--sat,0px) + 16px)",display:"flex",flexDirection:"column",gap:"12px",position:"relative",zIndex:1}}>
          <SearchBar location={activeLocation} onSearch={handleSearch} onSelectSuggestion={handleSelectSuggestion} onSettings={()=>setSettOpen(true)} onLocate={()=>fetchGeoLocation(true)} loading={weatherLoading}/>

          {searchError&&(
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderRadius:"14px",background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",color:"#fca5a5",fontSize:"13px",marginTop:"2px"}}>
              <span>{searchError}</span>
              <button onClick={()=>setSearchError(null)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",padding:0}}>
                <I.X s={14} c="#fca5a5"/>
              </button>
            </div>
          )}

          {lowSig?(
            <div style={{display:"flex",flexDirection:"column",gap:"12px"}}>
              <HeroCard cw={cw} location={activeLocation} imp={imp}/>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderRadius:"14px",background:"var(--thin)",border:"1px solid var(--border-light)"}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                  <I.Wifi0 s={13} c="var(--text-dim)"/>
                  <span style={{fontSize:"12px",color:"var(--text-dim)",fontWeight:500}}>Low Signal Home</span>
                </div>
                <button onClick={()=>setLowSig(false)} style={{width:"28px",height:"28px",borderRadius:"50%",background:"var(--thin)",border:"1px solid var(--border-light)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                  <I.X s={13} c="var(--text-main)"/>
                </button>
              </div>
            </div>
          ):(
            <>
              <MapHero isDark={isDark} coords={coords} activeLocation={activeLocation} lowSig={lowSig} onDisableLowSig={()=>setLowSig(false)}/>
              <HeroCard cw={cw} location={activeLocation} imp={imp}/>
              <StatGrid cw={cw} imp={imp}/>
              <ExtMetrics cw={cw}/>
              <HourlyScroll hourly={liveHourly} imp={imp}/>
              <div style={{display:"flex",gap:"12px"}}>
                <AQICard aqi={aqi}/>
                <SunCard sun_moon={sun_moon}/>
              </div>
              <DailyAccordion daily={liveDaily} imp={imp}/>
            </>
          )}
        </div>
      </div>

      {/* ════════════════════════════════════════════
          DESKTOP LAYOUT  (hidden on mobile <1024px)
          3-column sticky dashboard
      ════════════════════════════════════════════ */}
      <div className="desktop-layout">
        <div className="page-inner">

          {/* sticky search bar */}
          <div className="col-search">
            <SearchBar location={activeLocation} onSearch={handleSearch} onSelectSuggestion={handleSelectSuggestion} onSettings={()=>setSettOpen(true)} onLocate={()=>fetchGeoLocation(true)} loading={weatherLoading}/>
            {searchError&&(
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderRadius:"14px",marginTop:"8px",background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",color:"#fca5a5",fontSize:"13px"}}>
                <span>{searchError}</span>
                <button onClick={()=>setSearchError(null)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",padding:0}}>
                  <I.X s={14} c="#fca5a5"/>
                </button>
              </div>
            )}
          </div>

          {lowSig?(
            <div style={{gridColumn:"1/-1",display:"flex",flexDirection:"column",gap:"12px",padding:"16px"}}>
              <HeroCard cw={cw} location={activeLocation} imp={imp}/>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderRadius:"14px",background:"var(--thin)",border:"1px solid var(--border-light)"}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                  <I.Wifi0 s={13} c="var(--text-dim)"/>
                  <span style={{fontSize:"12px",color:"var(--text-dim)",fontWeight:500}}>Low Signal Home</span>
                </div>
                <button onClick={()=>setLowSig(false)} style={{width:"28px",height:"28px",borderRadius:"50%",background:"var(--thin)",border:"1px solid var(--border-light)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                  <I.X s={13} c="var(--text-main)"/>
                </button>
              </div>
            </div>
          ):(
            <>
              {/* LEFT sidebar */}
              <div className="col-left">
                <HeroCard cw={cw} location={activeLocation} imp={imp}/>
                <div style={{display:"flex",gap:"12px"}}>
                  <AQICard aqi={aqi}/>
                  <SunCard sun_moon={sun_moon}/>
                </div>
                <PollutantCard aqi={aqi}/>
                <WeatherTip cw={cw} imp={imp}/>
              </div>

              {/* CENTRE */}
              <div className="col-centre">
                <MapHero isDark={isDark} coords={coords} activeLocation={activeLocation} lowSig={lowSig} onDisableLowSig={()=>setLowSig(false)}/>
                <HourlyScroll hourly={liveHourly} imp={imp}/>
                <DailyAccordion daily={liveDaily} imp={imp}/>
              </div>

              {/* RIGHT sidebar */}
              <div className="col-right">
                <StatGrid cw={cw} imp={imp}/>
                <ExtMetrics cw={cw}/>
                <TempTrendChart daily={liveDaily} imp={imp}/>
                <PrecipBars daily={liveDaily} imp={imp}/>
              </div>
            </>
          )}

        </div>
      </div>

      <SettingsPanel open={settOpen} onClose={()=>setSettOpen(false)} imp={imp} setImp={setImp} lowSig={lowSig} setLowSig={setLowSig} themePref={themePref} setThemePref={setThemePref} geoState={geoState} locationEnabled={locationEnabled} onToggleLocation={handleToggleLocation}/>
    </div>
  );
};

const _mount=()=>{
  const el=document.getElementById("root");
  if(!el) return;
  ReactDOM.createRoot(el).render(<App/>);
};
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",_mount);
else _mount();
</script>

<script>
  // Register Service Worker for PWA
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('[SW] Registered:', reg.scope))
        .catch(err => console.warn('[SW] Registration failed:', err));
    });
  }
</script>
</body>
</html>
